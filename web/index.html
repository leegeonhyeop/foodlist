<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 정보 조회</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #677084; --line: #e3e6ec;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --warn: #b4541a; --warn-soft: #fdf0e6;
    --ok: #2e7d4f; --ok-soft: #e7f5ec; --mark: #fff1a8; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 12px rgba(20,30,50,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --surface: #1d2129; --text: #e7eaf0; --muted: #9aa3b5; --line: #2e3440;
      --accent: #7d9cff; --accent-soft: #263152; --warn: #f0a46c; --warn-soft: #3a2a1f;
      --ok: #7fd1a0; --ok-soft: #1f3328; --mark: #5c4f12; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); } .dot.demo { background: var(--warn); } .dot.err { background: #d33; }

  .controls { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search { flex: 1 1 260px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; font-size: 15px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
  .chip.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .reset { margin-left: auto; font-size: 13px; background: none; border: none; color: var(--accent); cursor: pointer; padding: 4px; }

  .summary { margin: 16px 2px 10px; font-size: 14px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 700; font-size: 16px; }
  .code { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta { font-size: 14px; color: var(--muted); }
  .price { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .desc { font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 600; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .hit { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
  .hit b { color: var(--text); font-weight: 600; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }

  .policy { margin-top: 24px; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .policy strong { color: var(--text); font-weight: 600; }

  dialog { border: none; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--text); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10,15,25,.45); }
  .dlg-head { position: sticky; top: 0; background: var(--surface); padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .dlg-head h2 { margin: 0; font-size: 19px; }
  .close { background: none; border: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 6px; }
  .dlg-body { padding: 14px 20px 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  th { width: 34%; color: var(--muted); font-weight: 500; }
  tr.allergy th, tr.allergy td { color: var(--warn); font-weight: 600; }
  tr.unknown td { color: var(--muted); font-style: italic; }
  .error { color: #d33; background: var(--surface); border: 1px solid #d33; border-radius: 12px; padding: 14px 16px; margin-top: 16px; white-space: pre-wrap; font-size: 14px; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    th { width: 40%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>상품 정보 조회</h1>
    <div class="status" id="status"><span class="dot"></span><span>불러오는 중…</span></div>
  </header>

  <section class="controls" aria-label="검색과 필터">
    <div class="row">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="상품명, 원산지, 보관법 등으로 검색 (예: 냉장, 의성)" autocomplete="off" aria-label="검색어">
      </label>
      <select id="field" aria-label="검색할 항목">
        <option value="">모든 항목에서</option>
      </select>
      <select id="sort" aria-label="정렬">
        <option value="code">상품코드순</option>
        <option value="price-asc">가격 낮은순</option>
        <option value="price-desc">가격 높은순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <div class="row" id="allergyRow">
      <span class="label">알레르기 성분 제외</span>
      <span id="allergyChips" class="row"></span>
      <button class="chip toggle" id="onlyAllergy" aria-pressed="false">알레르기 주의 상품만</button>
      <button class="reset" id="reset">초기화</button>
    </div>
  </section>

  <div class="summary" id="summary" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div id="error"></div>
  <div class="policy" id="policy" hidden></div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div>
      <h2 id="dlgTitle"></h2>
      <div class="meta" id="dlgMeta"></div>
    </div>
    <button class="close" id="dlgClose" aria-label="닫기">×</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script>
// ───────── 설정 ─────────
const CFG = window.APP_CONFIG || {};
// 알레르기 성분 후보 — 데이터에 실제로 나오는 것만 버튼으로 보여 준다
const ALLERGY_KEYWORDS = ["견과류", "땅콩", "밀", "대두", "계란", "우유", "갑각류", "새우", "게", "복숭아", "토마토", "메밀", "고등어", "조개류", "아황산"];
const ALLERGY_CODES = ["allergens", "allergy_warning"];

// ───────── 상태 ─────────
let DB = null;               // { products, items, info, policy }
const state = { q: "", field: "", sort: "code", exclude: new Set(), onlyAllergy: false };

// ───────── 데이터 불러오기 ─────────
async function fetchTable(table, query) {
  const url = `${CFG.SUPABASE_URL.replace(/\/$/, "")}/rest/v1/${table}?${query}`;
  const res = await fetch(url, { headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CFG.SUPABASE_ANON_KEY}` } });
  if (!res.ok) throw new Error(`${table} 조회 실패 (${res.status}): ${await res.text()}`);
  return res.json();
}

async function load() {
  const live = Boolean(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
  let raw;
  if (live) {
    const [products, info_items, product_info, shipping_policy] = await Promise.all([
      fetchTable("products", "select=product_id,name,size,price,description&order=product_id"),
      fetchTable("info_items", "select=item_code,label,description,sort_order&order=sort_order"),
      fetchTable("product_info", "select=product_id,item_code,content&order=id"),
      fetchTable("shipping_policy", "select=*"),
    ]);
    raw = { products, info_items, product_info, shipping_policy };
  } else {
    if (!window.DEMO_DATA) throw new Error("config.js에 Supabase 정보가 없고 demo-data.js도 찾을 수 없습니다.");
    raw = window.DEMO_DATA;
  }
  return { live, ...normalize(raw) };
}

// 상품마다 항목을 모아 둔다: product.info = { item_code: content }
function normalize({ products, info_items, product_info, shipping_policy }) {
  const items = [...info_items].sort((a, b) => a.sort_order - b.sort_order);
  const byId = new Map(products.map(p => [p.product_id, { ...p, info: {} }]));
  for (const r of product_info) {
    const p = byId.get(r.product_id);
    if (p) p.info[r.item_code] = r.content;
  }
  const list = [...byId.values()];
  for (const p of list) p.allergy = allergyOf(p);
  return { products: list, items, policy: shipping_policy[0] || null };
}

// ───────── 알레르기 판단 (query_allergy_products.sql 기준과 동일) ─────────
// '미확인'으로 시작하는 값은 정보 없음으로 취급
const isUnknown = v => typeof v === "string" && v.trim().startsWith("미확인");
function allergyOf(p) {
  const a = p.info.allergens, w = p.info.allergy_warning;
  const aKnown = a != null && !isUnknown(a), wKnown = w != null && !isUnknown(w);
  const contains = aKnown && a.trim() !== "없음";
  const texts = [contains ? a : "", wKnown ? w : ""].join(" ");
  return {
    has: contains || wKnown,                         // 알레르기 주의 상품
    none: aKnown && a.trim() === "없음" && !wKnown,   // 문서에 '없음'으로 확인됨
    unknown: !aKnown && !wKnown,                     // 알레르기 정보 없음/미확인
    keywords: ALLERGY_KEYWORDS.filter(k => texts.includes(k)),
  };
}

// ───────── 검색 ─────────
const norm = s => String(s ?? "").toLowerCase();
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function highlight(text, terms) {
  const safe = escapeHtml(text);
  if (!terms.length) return safe;
  const re = new RegExp(`(${terms.map(t => escapeRe(escapeHtml(t))).join("|")})`, "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

// 검색 대상 필드 목록: [라벨, 값]
function fieldsOf(p) {
  const base = [["상품명", p.name], ["상품코드", p.product_id], ["용량", p.size], ["상품설명", p.description]];
  const extra = DB.items.filter(i => p.info[i.item_code] != null).map(i => [i.label, p.info[i.item_code], i.item_code]);
  return base.concat(extra);
}

function matchProduct(p, terms) {
  if (!terms.length) return { ok: true, hits: [] };
  let fields = fieldsOf(p);
  if (state.field) fields = fields.filter(f => f[2] === state.field);
  // 모든 검색어가 (어느 필드든) 들어 있어야 일치
  const ok = terms.every(t => fields.some(f => norm(f[1]).includes(t)));
  const hits = ok ? fields.filter(f => terms.some(t => norm(f[1]).includes(t))) : [];
  return { ok, hits };
}

// ───────── 화면 그리기 ─────────
const $ = id => document.getElementById(id);
const won = n => Number(n).toLocaleString("ko-KR") + "원";

function render() {
  const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let rows = [];
  for (const p of DB.products) {
    if (state.onlyAllergy && !p.allergy.has) continue;
    if ([...state.exclude].some(k => p.allergy.keywords.includes(k))) continue;
    const m = matchProduct(p, terms);
    if (m.ok) rows.push({ p, hits: m.hits });
  }
  const cmp = {
    code: (a, b) => a.p.product_id.localeCompare(b.p.product_id),
    name: (a, b) => a.p.name.localeCompare(b.p.name, "ko"),
    "price-asc": (a, b) => a.p.price - b.p.price,
    "price-desc": (a, b) => b.p.price - a.p.price,
  }[state.sort];
  rows.sort(cmp);

  const filtered = terms.length || state.exclude.size || state.onlyAllergy || state.field;
  $("summary").textContent = filtered ? `전체 ${DB.products.length}개 중 ${rows.length}개` : `전체 ${DB.products.length}개 상품`;
  if (state.exclude.size) {
    const unknown = rows.filter(r => r.p.allergy.unknown).length;
    if (unknown) $("summary").textContent += ` · 알레르기 정보가 없는 상품 ${unknown}개 포함 (직접 확인 필요)`;
  }

  if (!rows.length) {
    $("grid").innerHTML = `<div class="empty">조건에 맞는 상품이 없어요. 검색어나 필터를 바꿔 보세요.</div>`;
    return;
  }
  $("grid").innerHTML = rows.map(({ p, hits }) => {
    const a = p.allergy;
    const badges = [];
    if (a.has) badges.push(`<span class="badge warn">알레르기 주의${a.keywords.length ? " · " + escapeHtml(a.keywords.join(", ")) : ""}</span>`);
    else if (a.none) badges.push(`<span class="badge ok">알레르기 유발 물질 없음</span>`);
    else badges.push(`<span class="badge">알레르기 정보 없음</span>`);
    if (p.info.sales_period) badges.push(`<span class="badge">${escapeHtml(p.info.sales_period)}</span>`);
    if (p.info.origin) badges.push(`<span class="badge">${escapeHtml(p.info.origin)}</span>`);
    // 이름·설명 밖에서 찾은 경우, 어디서 찾았는지 보여 준다
    const extraHits = hits.filter(h => !["상품명", "상품설명"].includes(h[0])).slice(0, 2);
    return `<button class="card" data-id="${escapeHtml(p.product_id)}">
      <div class="card-top"><span class="name">${highlight(p.name, terms)}</span><span class="code">${highlight(p.product_id, terms)}</span></div>
      <div class="meta">${highlight(p.size, terms)} · <span class="price">${won(p.price)}</span></div>
      <div class="desc">${highlight(p.description, terms)}</div>
      <div class="badges">${badges.join("")}</div>
      ${extraHits.map(h => `<div class="hit"><b>${escapeHtml(h[0])}</b> ${highlight(h[1], terms)}</div>`).join("")}
    </button>`;
  }).join("");
}

function openDetail(id) {
  const p = DB.products.find(x => x.product_id === id);
  if (!p) return;
  const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  $("dlgTitle").textContent = p.name;
  $("dlgMeta").innerHTML = `${escapeHtml(p.product_id)} · ${escapeHtml(p.size)} · <span class="price">${won(p.price)}</span>`;
  const rows = [["상품설명", p.description, ""]].concat(
    DB.items.filter(i => p.info[i.item_code] != null).map(i => [i.label, p.info[i.item_code], i.item_code])
  );
  const missing = DB.items.filter(i => p.info[i.item_code] == null).map(i => i.label);
  $("dlgBody").innerHTML = `<table><tbody>${rows.map(([label, val, code]) => {
    const cls = isUnknown(val) ? "unknown" : (ALLERGY_CODES.includes(code) && val.trim() !== "없음" ? "allergy" : "");
    return `<tr class="${cls}"><th>${escapeHtml(label)}</th><td>${highlight(val, terms)}</td></tr>`;
  }).join("")}</tbody></table>
  ${missing.length ? `<p class="meta" style="margin-top:12px">문서에 없는 항목: ${escapeHtml(missing.join(", "))}</p>` : ""}`;
  $("dlg").showModal();
}

function renderStatic() {
  // 항목 선택 목록
  $("field").insertAdjacentHTML("beforeend", DB.items.map(i => `<option value="${escapeHtml(i.item_code)}">${escapeHtml(i.label)}에서</option>`).join(""));
  // 데이터에 실제로 나오는 알레르기 성분만 버튼으로
  const found = ALLERGY_KEYWORDS.filter(k => DB.products.some(p => p.allergy.keywords.includes(k)));
  $("allergyChips").innerHTML = found.length
    ? found.map(k => `<button class="chip" data-k="${escapeHtml(k)}" aria-pressed="false">${escapeHtml(k)}</button>`).join("")
    : `<span class="label">(해당 성분 없음)</span>`;
  // 배송정책
  const s = DB.policy;
  if (s) {
    const regions = Array.isArray(s.same_day_regions) ? s.same_day_regions.join(", ") : s.same_day_regions;
    $("policy").innerHTML = `
      <span><strong>무료배송</strong> ${won(s.free_shipping_min)} 이상 (미만 시 ${won(s.base_shipping_fee)})</span>
      <span><strong>당일배송</strong> ${escapeHtml(regions)} · ${escapeHtml(String(s.same_day_cutoff).slice(0, 5))} 이전 주문</span>
      <span><strong>신선식품 발송</strong> ${escapeHtml(s.fresh_ship_days)} (금요일 주문은 다음 주 월요일)</span>`;
    $("policy").hidden = false;
  }
}

function setStatus(kind, text) {
  $("status").innerHTML = `<span class="dot ${kind}"></span><span>${escapeHtml(text)}</span>`;
}

// ───────── 이벤트 ─────────
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("field").addEventListener("change", e => { state.field = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("allergyChips").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  const k = b.dataset.k;
  state.exclude.has(k) ? state.exclude.delete(k) : state.exclude.add(k);
  b.setAttribute("aria-pressed", state.exclude.has(k));
  render();
});
$("onlyAllergy").addEventListener("click", e => {
  state.onlyAllergy = !state.onlyAllergy;
  e.currentTarget.setAttribute("aria-pressed", state.onlyAllergy);
  render();
});
$("reset").addEventListener("click", () => {
  Object.assign(state, { q: "", field: "", sort: "code", onlyAllergy: false });
  state.exclude.clear();
  $("q").value = ""; $("field").value = ""; $("sort").value = "code";
  document.querySelectorAll("[aria-pressed]").forEach(b => b.setAttribute("aria-pressed", "false"));
  render();
});
$("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id); });
$("dlgClose").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

// ───────── 시작 ─────────
load().then(data => {
  DB = data;
  setStatus(data.live ? "live" : "demo", data.live ? "Supabase 연결됨" : "예시 데이터 (config.js 미설정)");
  renderStatic();
  render();
}).catch(err => {
  setStatus("err", "불러오기 실패");
  $("error").innerHTML = `<div class="error">${escapeHtml(err.message)}\n\nconfig.js의 주소·키와 Supabase의 테이블(schema.sql, seed.sql 실행 여부)을 확인하세요.</div>`;
});
</script>
